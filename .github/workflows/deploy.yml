# ============================================================
# deploy.yml —— 推送即自动构建部署
#
# 这个文件属于 GitHub 的 GitHub Actions（持续集成 / 持续部署）功能。
# 它只说明一件事：
#   「以后每次有人往 main 分支推代码，你就在自己的服务器上替我
#     装依赖、跑构建，把构建结果发布成网站。」
#
# 关键性质：仓库里存的是【源码】，网站上是【构建产物】。
# 所以 .output/ 永远不进仓库（见 .gitignore），你只需要 push 源码。
#
# 版本号均已核对 GitHub 上的最新发布：
#   actions/checkout@v7 · actions/setup-node@v7 · actions/configure-pages@v6
#   actions/upload-pages-artifact@v5 · actions/deploy-pages@v5
# ============================================================

name: Deploy to GitHub Pages

# ---------- 一、触发条件 ----------
on:
  push:
    branches: [main] # 只有 main 分支收到推送时才跑
  workflow_dispatch: # 也允许在 Actions 页面手动点「Run workflow」

# ---------- 二、权限：最小必要 ----------
# 默认权限是最小的，需要什么显式声明什么。
permissions:
  contents: read # 读取仓库代码
  pages: write # 写入 Pages 站点（部署必需）
  id-token: write # 让 GitHub 签发一次性凭据供部署使用（部署必需）

# ---------- 三、并发控制 ----------
concurrency:
  group: pages
  cancel-in-progress: false # 不取消正在进行的部署，让新的排队等待

# ---------- 四、任务 ----------
jobs:
  # ===== 任务 1：构建 =====
  build:
    runs-on: ubuntu-latest # GitHub 提供的临时 Ubuntu 机器，用完销毁
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Nuxt 4 要求 Node >= 20.19 / >= 22.12；这里用 22 这条 LTS 线
          node-version: 22
          cache: npm # 缓存 npm 下载目录，二次构建会快很多

      - name: Install dependencies
        # 用 ci 而不是 install：它严格按 package-lock.json 还原，
        # 保证「我本地能跑」和「服务器上跑」装出来的是同一套依赖。
        run: npm ci

      - name: Build static site
        # nuxt generate：把每个页面在构建期渲染成真实 HTML，输出到 .output/public
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public # Nuxt 的静态产物目录

  # ===== 任务 2：部署 =====
  deploy:
    needs: build # 必须等 build 成功之后才开始；构建失败就不会部署
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # 把网址回填到 Actions 页面
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
